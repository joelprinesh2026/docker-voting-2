services:

  db:
    image: mysql:8
    container_name: voting-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: voting_app
      MYSQL_USER: voting_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"

  backend:
    image: joelprinesh/docker-voting:backend
    container_name: voting-backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: voting_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: voting_app
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    image: joelprinesh/docker-voting:frontend
    container_name: voting-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
